
name: Build AlexGD

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Build Android mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Save mod
        uses: actions/upload-artifact@v4
        with:
          name: AlexGD-Android
          path: ${{ steps.build.outputs.build-output }}
